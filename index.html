<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0a0a0c;color:#f2f2f7;font-size:17px;}
#app{width:100%;min-height:600px;background:#0a0a0c;}
.topbar{background:#1c1c1e;border-bottom:1px solid rgba(255,255,255,0.1);padding:18px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.topbar h1{font-size:28px;font-weight:600;color:#f2f2f7;}
.topbar p{font-size:15px;margin-top:3px;color:#aeaeb2;}
.icon-btn{background:#2c2c2e;border:none;cursor:pointer;font-size:22px;padding:10px 12px;border-radius:12px;display:flex;align-items:center;color:#aeaeb2;transition:color .15s;}
.icon-btn:hover{color:#f2f2f7;background:#3a3a3c;}
.screen{display:none;padding:24px 32px 110px;}
.screen.active{display:block;}
.navbar{background:#1c1c1e;border-top:1px solid rgba(255,255,255,0.1);display:flex;padding:12px 0 16px;position:sticky;bottom:0;z-index:10;}
.nav-btn{flex:1;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;cursor:pointer;font-size:13px;font-family:inherit;color:#aeaeb2;transition:color .15s;}
.nav-btn i{font-size:28px;}
.nav-btn.active{color:#9b72f0;}
.fab{width:62px;height:62px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;background:#7c55d4;position:fixed;right:36px;bottom:100px;z-index:100;transition:opacity .3s,transform .3s;box-shadow:0 4px 24px rgba(124,85,212,0.5);}
.fab:hover{transform:scale(1.08);}
.fab.hidden{opacity:0;pointer-events:none;transform:scale(0.8);}
.card{border-radius:18px;border:1px solid rgba(255,255,255,0.1);padding:24px;margin-bottom:18px;background:#1c1c1e;}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px;}
.metric{background:#2c2c2e;border-radius:14px;padding:18px 20px;}
.metric-label{font-size:14px;color:#aeaeb2;margin-bottom:8px;}
.metric-value{font-size:28px;font-weight:600;color:#f2f2f7;}
.metric-value.acc{color:#9b72f0;}
.sec-title{font-size:16px;font-weight:600;color:#aeaeb2;margin-bottom:16px;}
.expense-row{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.07);}
.expense-row:last-child{border-bottom:none;}
.cat-icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.exp-info{flex:1;min-width:0;}
.exp-title{font-size:16px;font-weight:500;color:#f2f2f7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.exp-sub{font-size:14px;color:#aeaeb2;margin-top:3px;}
.exp-amt{font-size:17px;font-weight:600;color:#f2f2f7;flex-shrink:0;}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;margin-left:7px;vertical-align:middle;}
.del-btn{background:none;border:none;cursor:pointer;font-size:22px;padding:8px;display:flex;align-items:center;color:#545458;transition:all .15s;flex-shrink:0;border-radius:10px;}
.del-btn:hover{color:#ff6b6b;background:rgba(255,107,107,0.12);}
.date-lbl{font-size:14px;font-weight:600;color:#aeaeb2;margin:18px 0 8px;}
.empty{text-align:center;padding:36px;font-size:16px;color:#aeaeb2;}
.modal-wrap{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.65);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.modal-wrap.open{display:flex;}
.modal-sheet{background:#1c1c1e;border-radius:26px 26px 0 0;width:100%;max-width:700px;padding:28px 28px 40px;max-height:90vh;overflow-y:auto;}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.modal-hdr h2{font-size:22px;font-weight:600;color:#f2f2f7;}
.close-btn{background:#2c2c2e;border:none;cursor:pointer;font-size:24px;padding:8px;border-radius:12px;display:flex;color:#aeaeb2;}
.field{margin-bottom:18px;}
.field-lbl{font-size:14px;color:#aeaeb2;margin-bottom:8px;display:block;}
.inp{width:100%;padding:14px 16px;border-radius:12px;font-size:17px;font-family:inherit;background:#2c2c2e;border:1px solid rgba(255,255,255,0.12);color:#f2f2f7;}
.inp:focus{outline:none;border-color:#9b72f0;}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.cat-chip{padding:14px 6px;border-radius:14px;cursor:pointer;font-size:13px;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;background:#2c2c2e;border:1px solid rgba(255,255,255,0.1);color:#aeaeb2;transition:all .15s;}
.cat-chip i{font-size:26px;}
.cat-chip.sel{background:#2d1f4e;border-color:#9b72f0;color:#c4a7ff;}
.sub-chips{display:flex;flex-wrap:wrap;gap:10px;}
.pill{padding:9px 18px;border-radius:99px;cursor:pointer;font-size:15px;font-family:inherit;background:#2c2c2e;border:1px solid rgba(255,255,255,0.1);color:#aeaeb2;transition:all .15s;}
.pill.sel{background:#2d1f4e;border-color:#9b72f0;color:#c4a7ff;}
.pill.mon-sel{background:#7c55d4;border-color:#7c55d4;color:#fff;}
.save-btn{width:100%;padding:17px;border:none;border-radius:14px;font-size:18px;font-family:inherit;font-weight:600;cursor:pointer;margin-top:10px;background:#7c55d4;color:#fff;}
.save-btn:hover{background:#9b72f0;}
.bar-row{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.bar-lbl{font-size:14px;color:#aeaeb2;width:110px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-track{flex:1;height:12px;border-radius:6px;overflow:hidden;background:#2c2c2e;}
.bar-fill{height:100%;border-radius:6px;}
.bar-val{font-size:14px;font-weight:500;color:#f2f2f7;width:80px;text-align:right;flex-shrink:0;}
.chart-wrap{position:relative;width:100%;}
.months-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-bottom:18px;scrollbar-width:none;}
.months-scroll::-webkit-scrollbar{display:none;}
.stat-up{background:#3d1515;color:#ff9999;}
.stat-dn{background:#0d2e20;color:#32d4a0;}
.stat-pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:4px 10px;border-radius:99px;margin-left:10px;}
.data-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.07);}
.data-row:last-child{border-bottom:none;}
.data-chk{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;background:#2c2c2e;border:2px solid rgba(255,255,255,0.15);transition:all .15s;}
.data-chk.on{background:#7c55d4;border-color:#7c55d4;}
.bulk-bar{display:none;border-radius:14px;padding:14px 18px;margin-bottom:16px;align-items:center;justify-content:space-between;background:#2d1f4e;border:1px solid #7c55d4;}
.bulk-bar.show{display:flex;}
.bulk-del{border:none;border-radius:10px;padding:10px 18px;font-size:15px;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:7px;background:#e24b4a;color:#fff;}
.filter-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-bottom:18px;scrollbar-width:none;}
.filter-scroll::-webkit-scrollbar{display:none;}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:99px;background:#e24b4a;color:#fff;font-size:13px;font-weight:600;padding:0 6px;margin-left:6px;vertical-align:middle;}
.confirm-sheet{background:#1c1c1e;border-radius:26px 26px 0 0;width:100%;max-width:700px;padding:30px 28px 40px;}
.confirm-sheet h2{font-size:22px;font-weight:600;color:#f2f2f7;margin-bottom:10px;}
.confirm-sheet p{font-size:16px;color:#aeaeb2;margin-bottom:26px;}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.btn-cancel-sm{padding:15px;border-radius:12px;font-size:17px;font-family:inherit;cursor:pointer;background:#2c2c2e;border:1px solid rgba(255,255,255,0.12);color:#f2f2f7;}
.btn-danger{padding:15px;border-radius:12px;font-size:17px;font-family:inherit;cursor:pointer;border:none;background:#e24b4a;color:#fff;}
.month-check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px;}
.month-check-item{border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:15px;background:#2c2c2e;border:1px solid rgba(255,255,255,0.1);color:#aeaeb2;transition:all .15s;}
.month-check-item.on{background:#2d1f4e;border-color:#9b72f0;color:#c4a7ff;}
.cmp-cat-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.07);}
.summary-row:last-child{border-bottom:none;}
.sub-bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding-left:16px;}
.sub-bar-lbl{font-size:13px;color:#aeaeb2;width:130px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sub-bar-track{flex:1;height:8px;border-radius:4px;overflow:hidden;background:#2c2c2e;}
.sub-bar-fill{height:100%;border-radius:4px;opacity:.75;}
.sub-bar-val{font-size:13px;color:#aeaeb2;width:72px;text-align:right;flex-shrink:0;}
.cat-section-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer;user-select:none;}
.cat-section-hdr .cat-icon-sm{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.cat-section-hdr .cat-name{font-size:16px;font-weight:600;color:#f2f2f7;flex:1;}
.cat-section-hdr .cat-total{font-size:16px;font-weight:600;color:#f2f2f7;}
.cat-section-hdr .toggle-icon{font-size:18px;color:#aeaeb2;}
.cat-section{margin-bottom:14px;border-bottom:1px solid rgba(255,255,255,0.07);padding-bottom:14px;}
.cat-section:last-child{border-bottom:none;padding-bottom:0;margin-bottom:0;}
</style>
</head>
<body>
<div id="app">
<div style="position:relative;">

  <div class="screen active" id="sc-home">
    <div class="topbar">
      <div><h1>My Expenses</h1><p id="home-sub"></p></div>
      <button class="icon-btn" onclick="openModal()" aria-label="Add expense"><i class="ti ti-plus"></i></button>
    </div>
    <div style="height:24px;"></div>
    <div class="metric-grid" id="home-metrics"></div>
    <div class="card"><div class="sec-title">Recent Expenses</div><div id="recent-list"></div></div>
  </div>

  <div class="screen" id="sc-analytics">
    <div class="topbar"><div><h1>Analytics</h1><p>Spending breakdown</p></div></div>
    <div style="height:24px;"></div>
    <div class="months-scroll" id="ana-months"></div>
    <div class="card"><div class="sec-title">By Category &amp; Subcategory</div><div id="ana-cat-sub"></div></div>
    <div class="card">
      <div class="sec-title">Category Distribution</div>
      <div class="chart-wrap" style="height:240px;"><canvas id="pie-chart"></canvas></div>
      <div id="pie-legend" style="display:flex;flex-wrap:wrap;gap:12px;margin-top:16px;font-size:14px;color:#aeaeb2;"></div>
    </div>
    <div class="card"><div class="sec-title">Top Expenses</div><div id="ana-top"></div></div>
  </div>

  <div class="screen" id="sc-compare">
    <div class="topbar"><div><h1>Compare</h1><p>Month-to-month view</p></div></div>
    <div style="height:24px;"></div>
    <div class="card">
      <div class="sec-title">Select Months</div>
      <div class="month-check-grid" id="mon-picker"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:4px;">
        <span style="font-size:14px;color:#aeaeb2;" id="sel-mon-label"></span>
        <button class="pill" style="font-size:14px;padding:6px 14px;" onclick="clearMonths()">Clear all</button>
      </div>
    </div>
    <div class="card"><div class="sec-title">Monthly Totals</div><div class="chart-wrap" style="height:260px;"><canvas id="bar-chart"></canvas></div></div>
    <div class="card">
      <div class="sec-title">Category Trend</div>
      <div class="cmp-cat-row" id="cmp-cat-row"></div>
      <div class="chart-wrap" style="height:220px;"><canvas id="line-chart"></canvas></div>
    </div>
    <div class="card"><div class="sec-title">Summary</div><div id="cmp-summary"></div></div>
  </div>

  <div class="screen" id="sc-data">
    <div class="topbar">
      <div><h1>Data <span id="data-badge"></span></h1><p>Manage your records</p></div>
      <button class="icon-btn" onclick="exportCSV()" aria-label="Export CSV"><i class="ti ti-download"></i></button>
    </div>
    <div style="height:24px;"></div>
    <div class="filter-scroll" id="data-filters"></div>
    <div class="bulk-bar" id="bulk-bar">
      <span style="font-size:15px;font-weight:600;color:#c4a7ff;" id="bulk-lbl">0 selected</span>
      <div style="display:flex;gap:10px;">
        <button class="btn-cancel-sm" style="padding:8px 16px;font-size:15px;" onclick="clearSel()">Cancel</button>
        <button class="bulk-del" onclick="bulkDel()"><i class="ti ti-trash"></i> Delete selected</button>
      </div>
    </div>
    <div class="card"><div id="data-list"></div></div>
  </div>

  <div class="navbar">
    <button class="nav-btn active" onclick="goTo('home')" id="nav-home"><i class="ti ti-home"></i>Home</button>
    <button class="nav-btn" onclick="goTo('analytics')" id="nav-analytics"><i class="ti ti-chart-pie"></i>Analytics</button>
    <button class="nav-btn" onclick="goTo('compare')" id="nav-compare"><i class="ti ti-chart-bar"></i>Compare</button>
    <button class="nav-btn" onclick="goTo('data')" id="nav-data"><i class="ti ti-database"></i>Data</button>
  </div>

  <button class="fab" id="fab" onclick="openModal()" aria-label="Add expense"><i class="ti ti-plus"></i></button>

  <div class="modal-wrap" id="add-modal">
    <div class="modal-sheet">
      <div class="modal-hdr"><h2>Add Expense</h2><button class="close-btn" onclick="closeModal()"><i class="ti ti-x"></i></button></div>
      <div class="field"><label class="field-lbl">Amount (R$)</label><input type="number" id="inp-amt" class="inp" placeholder="0,00" min="0" step="0.01"></div>
      <div class="field"><label class="field-lbl">Description</label><input type="text" id="inp-desc" class="inp" placeholder="e.g. Monthly rent"></div>
      <div class="field"><label class="field-lbl">Category</label><div class="cat-grid" id="cat-grid"></div></div>
      <div class="field" id="sub-field" style="display:none;"><label class="field-lbl">Sub-category</label><div class="sub-chips" id="sub-chips"></div></div>
      <div class="field"><label class="field-lbl">Date</label><input type="date" id="inp-date" class="inp"></div>
      <button class="save-btn" onclick="saveExp()">Save Expense</button>
    </div>
  </div>

  <div class="modal-wrap" id="conf-modal">
    <div class="confirm-sheet">
      <h2 id="conf-title">Delete?</h2>
      <p id="conf-msg">This cannot be undone.</p>
      <div class="btn-row">
        <button class="btn-cancel-sm" onclick="closeConf()">Cancel</button>
        <button class="btn-danger" id="conf-ok">Delete</button>
      </div>
    </div>
  </div>

</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const CATS=[
  {id:'transport',label:'Transport',icon:'ti-car',bg:'#2d1f4e',fg:'#c4a7ff',hex:'#7c55d4'},
  {id:'restaurant',label:'Restaurants',icon:'ti-tools-kitchen-2',bg:'#3d1515',fg:'#ff9999',hex:'#e24b4a'},
  {id:'market',label:'Market',icon:'ti-shopping-cart',bg:'#0d2e20',fg:'#32d4a0',hex:'#1d9e75'},
  {id:'entertainment',label:'Entertainment',icon:'ti-device-gamepad-2',bg:'#0d2038',fg:'#85b7eb',hex:'#378add'},
  {id:'shop',label:'Shop',icon:'ti-shirt',bg:'#2e1e00',fg:'#fac775',hex:'#ef9f27'},
  {id:'home',label:'Home',icon:'ti-home-2',bg:'#1a2e1a',fg:'#6fcf6f',hex:'#3d9e3d'},
  {id:'others',label:'Others',icon:'ti-dots-circle-horizontal',bg:'#2a2a28',fg:'#b4b2a9',hex:'#888780'}
];
const SUBCATS={
  transport:['Uber','Bus','99','Taxi'],
  restaurant:['iFood','Bar','Café','Lunch'],
  market:['Supermarket','Pharmacy','Bakery'],
  entertainment:['Cinema','Streaming','Event','Game','Music'],
  shop:['Clothing','Electronics','Home goods'],
  home:['Apartment Rent','Light bill','Internet bill','Condo'],
  others:['Other']
};

let expenses=[],selCat=null,selSub=null,activeScreen='home';
let anaMon=null,cmpCat='transport',cmpMonths=new Set(),dataFilter='all',selIds=new Set();
let pieChart=null,barChart=null,lineChart=null,lastScrollY=0,fabHidden=false;
let expandedCats=new Set();

function tl(){try{return JSON.parse(localStorage.getItem('expv5')||'[]');}catch(e){return[];}}
function ts(){try{localStorage.setItem('expv5',JSON.stringify(expenses));}catch(e){}}
function catById(id){return CATS.find(c=>c.id===id)||CATS[CATS.length-1];}
function fmt(v){return'R$'+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function mk(d){return d.slice(0,7);}
function mlbl(k){const ms=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const[y,m]=k.split('-');return ms[parseInt(m)-1]+' '+y;}
function tod(){return new Date().toISOString().slice(0,10);}
function cmk(){return tod().slice(0,7);}
function allMons(){const ks=[...new Set(expenses.map(e=>mk(e.date)))].sort();if(!ks.length)ks.push(cmk());return ks;}

window.addEventListener('scroll',()=>{
  const fab=document.getElementById('fab');
  if(!fab||activeScreen==='data')return;
  const sy=window.scrollY;
  if(sy>lastScrollY+15&&!fabHidden){fabHidden=true;fab.classList.add('hidden');}
  else if(sy<lastScrollY-15&&fabHidden){fabHidden=false;fab.classList.remove('hidden');}
  lastScrollY=sy;
},{passive:true});

function goTo(s){
  activeScreen=s;lastScrollY=0;fabHidden=false;
  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('sc-'+s).classList.add('active');
  document.getElementById('nav-'+s).classList.add('active');
  const fab=document.getElementById('fab');
  fab.classList.remove('hidden');
  fab.style.display=s==='data'?'none':'flex';
  window.scrollTo(0,0);
  if(s==='home')renderHome();
  if(s==='analytics')renderAnalytics();
  if(s==='compare')renderCompare();
  if(s==='data')renderData();
}

function openModal(){
  selCat=null;selSub=null;
  document.getElementById('inp-amt').value='';
  document.getElementById('inp-desc').value='';
  document.getElementById('inp-date').value=tod();
  renderCatGrid();
  document.getElementById('sub-field').style.display='none';
  document.getElementById('add-modal').classList.add('open');
}
function closeModal(){document.getElementById('add-modal').classList.remove('open');}
function renderCatGrid(){
  document.getElementById('cat-grid').innerHTML=CATS.map(c=>`
    <button class="cat-chip${selCat===c.id?' sel':''}" onclick="pickCat('${c.id}')">
      <i class="ti ${c.icon}"></i>${c.label}
    </button>`).join('');
}
function pickCat(id){
  selCat=id;selSub=null;renderCatGrid();
  const subs=SUBCATS[id]||[];
  const sf=document.getElementById('sub-field');
  if(subs.length){sf.style.display='block';document.getElementById('sub-chips').innerHTML=subs.map(s=>`<button class="pill" onclick="pickSub('${s}')">${s}</button>`).join('');}
  else sf.style.display='none';
}
function pickSub(s){selSub=s;document.querySelectorAll('#sub-chips .pill').forEach(b=>b.classList.toggle('sel',b.textContent===s));}
function saveExp(){
  const amt=parseFloat(document.getElementById('inp-amt').value);
  const desc=document.getElementById('inp-desc').value.trim();
  const date=document.getElementById('inp-date').value;
  if(!amt||amt<=0){document.getElementById('inp-amt').focus();return;}
  if(!selCat)return;
  expenses.push({id:Date.now(),amt,desc:desc||catById(selCat).label,cat:selCat,sub:selSub,date});
  expenses.sort((a,b)=>b.date.localeCompare(a.date));
  ts();closeModal();
  if(activeScreen==='home')renderHome();
  updBadge();
}

function renderHome(){
  document.getElementById('home-sub').textContent=mlbl(cmk());
  const now=new Date(),ws=new Date(now);ws.setDate(now.getDate()-now.getDay());
  const me=expenses.filter(e=>mk(e.date)===cmk());
  const we=expenses.filter(e=>new Date(e.date+'T00:00:00')>=ws);
  const te=expenses.filter(e=>e.date===tod());
  document.getElementById('home-metrics').innerHTML=`
    <div class="metric"><div class="metric-label">This Month</div><div class="metric-value acc">${fmt(me.reduce((s,e)=>s+e.amt,0))}</div></div>
    <div class="metric"><div class="metric-label">This Week</div><div class="metric-value">${fmt(we.reduce((s,e)=>s+e.amt,0))}</div></div>
    <div class="metric"><div class="metric-label">Today</div><div class="metric-value">${fmt(te.reduce((s,e)=>s+e.amt,0))}</div></div>
    <div class="metric"><div class="metric-label">Transactions</div><div class="metric-value">${me.length}</div></div>`;
  const list=document.getElementById('recent-list');
  if(!expenses.length){list.innerHTML=`<div class="empty"><i class="ti ti-receipt-off" style="font-size:48px;display:block;margin-bottom:12px;"></i>No expenses yet. Click + to add your first.</div>`;return;}
  let grp={};expenses.slice(0,40).forEach(e=>{if(!grp[e.date])grp[e.date]=[];grp[e.date].push(e);});
  const yd=new Date(Date.now()-86400000).toISOString().slice(0,10);
  list.innerHTML=Object.entries(grp).map(([date,items])=>{
    const lbl=date===tod()?'Today':date===yd?'Yesterday':date;
    return`<div class="date-lbl">${lbl}</div>`+items.map(e=>{
      const c=catById(e.cat);
      return`<div class="expense-row">
        <div class="cat-icon" style="background:${c.bg}"><i class="ti ${c.icon}" style="color:${c.fg}"></i></div>
        <div class="exp-info">
          <div class="exp-title">${e.desc}${e.sub?`<span class="tag" style="background:${c.bg};color:${c.fg}">${e.sub}</span>`:''}</div>
          <div class="exp-sub">${c.label}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="exp-amt">${fmt(e.amt)}</div>
          <button class="del-btn" onclick="confirmDel(${e.id})"><i class="ti ti-trash"></i></button>
        </div>
      </div>`;
    }).join('');
  }).join('');
}

function confirmDel(id){
  const e=expenses.find(x=>x.id===id);
  document.getElementById('conf-title').textContent='Delete "'+(e?e.desc:'expense')+'"?';
  document.getElementById('conf-msg').textContent='This record will be permanently removed.';
  document.getElementById('conf-ok').onclick=()=>{
    expenses=expenses.filter(x=>x.id!==id);ts();closeConf();
    if(activeScreen==='home')renderHome();
    if(activeScreen==='data')renderData();
    if(activeScreen==='analytics')renderAnalytics();
    updBadge();
  };
  document.getElementById('conf-modal').classList.add('open');
}
function closeConf(){document.getElementById('conf-modal').classList.remove('open');}

function renderAnalytics(){
  const months=allMons();
  if(!anaMon||!months.includes(anaMon))anaMon=months[months.length-1];
  document.getElementById('ana-months').innerHTML=months.map(m=>`<button class="pill${anaMon===m?' mon-sel':''}" onclick="setAnaMon('${m}')">${mlbl(m)}</button>`).join('');
  const fil=expenses.filter(e=>mk(e.date)===anaMon);
  const total=fil.reduce((s,e)=>s+e.amt,0);

  // Build by cat + subcat
  const byCat={};
  fil.forEach(e=>{
    if(!byCat[e.cat])byCat[e.cat]={total:0,subs:{}};
    byCat[e.cat].total+=e.amt;
    const sk=e.sub||'(no subcategory)';
    byCat[e.cat].subs[sk]=(byCat[e.cat].subs[sk]||0)+e.amt;
  });
  const sortedCats=Object.entries(byCat).sort((a,b)=>b[1].total-a[1].total);
  const catMax=sortedCats[0]?.[1]?.total||1;
  const container=document.getElementById('ana-cat-sub');
  if(!sortedCats.length){container.innerHTML=`<div class="empty">No data for this month.</div>`;}
  else{
    container.innerHTML=sortedCats.map(([cid,data])=>{
      const c=catById(cid);
      const pct=Math.round(data.total/total*100);
      const subEntries=Object.entries(data.subs).sort((a,b)=>b[1]-a[1]);
      const isOpen=expandedCats.has(cid);
      const subHtml=subEntries.map(([sk,sv])=>`
        <div class="sub-bar-row">
          <div class="sub-bar-lbl">${sk}</div>
          <div class="sub-bar-track"><div class="sub-bar-fill" style="width:${Math.round(sv/data.total*100)}%;background:${c.hex}"></div></div>
          <div class="sub-bar-val">${fmt(sv)}</div>
        </div>`).join('');
      return`<div class="cat-section">
        <div class="cat-section-hdr" onclick="toggleCatExpand('${cid}')">
          <div class="cat-icon-sm" style="background:${c.bg}"><i class="ti ${c.icon}" style="color:${c.fg}"></i></div>
          <div class="cat-name">${c.label} <span style="font-size:13px;color:#aeaeb2;font-weight:400;">${pct}%</span></div>
          <div class="bar-track" style="flex:1;height:10px;margin:0 14px;"><div class="bar-fill" style="width:${Math.round(data.total/catMax*100)}%;background:${c.hex}"></div></div>
          <div class="cat-total">${fmt(data.total)}</div>
          <i class="ti ${isOpen?'ti-chevron-up':'ti-chevron-down'} toggle-icon"></i>
        </div>
        ${isOpen?`<div style="margin-top:10px;">${subHtml}</div>`:''}
      </div>`;
    }).join('');
  }

  if(pieChart){pieChart.destroy();pieChart=null;}
  if(sortedCats.length){
    pieChart=new Chart(document.getElementById('pie-chart'),{type:'doughnut',data:{labels:sortedCats.map(([c])=>catById(c).label),datasets:[{data:sortedCats.map(([,d])=>Math.round(d.total*100)/100),backgroundColor:sortedCats.map(([c])=>catById(c).hex),borderWidth:2,borderColor:'#1c1c1e'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+fmt(ctx.parsed)+' ('+Math.round(ctx.parsed/total*100)+'%)'}}}}});
    document.getElementById('pie-legend').innerHTML=sortedCats.map(([cid,d])=>`<span style="display:flex;align-items:center;gap:6px;"><span style="width:13px;height:13px;border-radius:3px;background:${catById(cid).hex};flex-shrink:0;"></span>${catById(cid).label} ${Math.round(d.total/total*100)}%</span>`).join('');
  }else document.getElementById('pie-legend').innerHTML='';

  const top=document.getElementById('ana-top');
  if(!fil.length){top.innerHTML=`<div class="empty">No expenses this month.</div>`;return;}
  top.innerHTML=[...fil].sort((a,b)=>b.amt-a.amt).slice(0,6).map(e=>{const c=catById(e.cat);return`<div class="expense-row"><div class="cat-icon" style="background:${c.bg}"><i class="ti ${c.icon}" style="color:${c.fg}"></i></div><div class="exp-info"><div class="exp-title">${e.desc}${e.sub?`<span class="tag" style="background:${c.bg};color:${c.fg}">${e.sub}</span>`:''}</div><div class="exp-sub">${c.label} · ${e.date}</div></div><div class="exp-amt">${fmt(e.amt)}</div></div>`;}).join('');
}
function setAnaMon(m){anaMon=m;renderAnalytics();}
function toggleCatExpand(id){if(expandedCats.has(id))expandedCats.delete(id);else expandedCats.add(id);renderAnalytics();}

function renderCompare(){
  const allM=allMons();
  if(cmpMonths.size===0)allM.forEach(m=>cmpMonths.add(m));
  document.getElementById('mon-picker').innerHTML=allM.map(m=>{
    const on=cmpMonths.has(m);
    return`<div class="month-check-item${on?' on':''}" onclick="toggleMon('${m}')">
      <span>${mlbl(m)}</span>
      <i class="ti ${on?'ti-check':'ti-circle'}" style="font-size:20px;color:${on?'#9b72f0':'#545458'}"></i>
    </div>`;
  }).join('');
  const selM=[...cmpMonths].sort();
  document.getElementById('sel-mon-label').textContent=selM.length===allM.length?'All months selected':selM.length===0?'No months selected':selM.length+' of '+allM.length+' months selected';
  if(!selM.length){
    if(barChart){barChart.destroy();barChart=null;}
    if(lineChart){lineChart.destroy();lineChart=null;}
    document.getElementById('cmp-summary').innerHTML=`<div class="empty">Select at least one month above.</div>`;
    return;
  }
  const totals=selM.map(m=>Math.round(expenses.filter(e=>mk(e.date)===m).reduce((s,e)=>s+e.amt,0)*100)/100);
  const gc='rgba(255,255,255,0.07)',tc='#aeaeb2';
  if(barChart){barChart.destroy();barChart=null;}
  barChart=new Chart(document.getElementById('bar-chart'),{type:'bar',data:{labels:selM.map(mlbl),datasets:[{label:'Total',data:totals,backgroundColor:selM.map((_,i)=>i===selM.length-1?'#7c55d4':'#4a3580'),borderRadius:10,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+fmt(ctx.parsed.y)}}},scales:{x:{grid:{display:false},ticks:{color:tc,font:{size:14},autoSkip:false,maxRotation:30}},y:{ticks:{callback:v=>'R$'+Number(v).toLocaleString('pt-BR'),color:tc,font:{size:13}},grid:{color:gc}}}}});
  document.getElementById('cmp-cat-row').innerHTML=CATS.map(c=>`<button class="pill${cmpCat===c.id?' sel':''}" onclick="setCmpCat('${c.id}')">${c.label}</button>`).join('');
  if(lineChart){lineChart.destroy();lineChart=null;}
  const ld=selM.map(m=>Math.round(expenses.filter(e=>mk(e.date)===m&&e.cat===cmpCat).reduce((s,e)=>s+e.amt,0)*100)/100);
  const lc=catById(cmpCat).hex;
  lineChart=new Chart(document.getElementById('line-chart'),{type:'line',data:{labels:selM.map(mlbl),datasets:[{label:catById(cmpCat).label,data:ld,borderColor:lc,backgroundColor:lc+'28',tension:.35,fill:true,pointRadius:5,pointBackgroundColor:lc}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+fmt(ctx.parsed.y)}}},scales:{x:{grid:{display:false},ticks:{color:tc,font:{size:14}}},y:{ticks:{callback:v=>'R$'+Number(v).toLocaleString('pt-BR'),color:tc,font:{size:13}},grid:{color:gc}}}}});
  document.getElementById('cmp-summary').innerHTML=selM.map((m,i)=>{
    const prev=i>0?totals[i-1]:null,diff=prev!==null?totals[i]-prev:null;
    let pill='';
    if(diff!==null&&Math.abs(diff)>0){const cls=diff>0?'stat-up':'stat-dn';pill=`<span class="stat-pill ${cls}">${diff>0?'▲':'▼'} ${fmt(Math.abs(diff))}</span>`;}
    return`<div class="summary-row"><span style="font-size:16px;color:#aeaeb2;">${mlbl(m)}</span><span style="font-size:16px;font-weight:600;color:#f2f2f7;">${fmt(totals[i])}${pill}</span></div>`;
  }).reverse().join('');
}
function toggleMon(m){if(cmpMonths.has(m))cmpMonths.delete(m);else cmpMonths.add(m);renderCompare();}
function clearMonths(){cmpMonths.clear();renderCompare();}
function setCmpCat(id){cmpCat=id;renderCompare();}

function renderData(){
  updBadge();
  document.getElementById('data-filters').innerHTML=[{id:'all',label:'All'},...CATS.map(c=>({id:c.id,label:c.label}))].map(f=>`<button class="pill${dataFilter===f.id?' sel':''}" onclick="setDF('${f.id}')">${f.label}</button>`).join('');
  const fil=dataFilter==='all'?expenses:expenses.filter(e=>e.cat===dataFilter);
  updBulk();
  const list=document.getElementById('data-list');
  if(!fil.length){list.innerHTML=`<div class="empty"><i class="ti ti-database-off" style="font-size:48px;display:block;margin-bottom:12px;"></i>No records found.</div>`;return;}
  let grp={};fil.forEach(e=>{if(!grp[e.date])grp[e.date]=[];grp[e.date].push(e);});
  const yd=new Date(Date.now()-86400000).toISOString().slice(0,10);
  list.innerHTML=Object.entries(grp).map(([date,items])=>{
    const lbl=date===tod()?'Today':date===yd?'Yesterday':date;
    return`<div class="date-lbl">${lbl}</div>`+items.map(e=>{
      const c=catById(e.cat),on=selIds.has(e.id);
      return`<div class="data-row">
        <div class="data-chk${on?' on':''}" onclick="togSel(${e.id})">${on?`<i class="ti ti-check" style="font-size:15px;color:#fff;"></i>`:''}</div>
        <div class="cat-icon" style="background:${c.bg};width:44px;height:44px;font-size:22px;border-radius:12px;"><i class="ti ${c.icon}" style="color:${c.fg}"></i></div>
        <div class="exp-info">
          <div class="exp-title">${e.desc}${e.sub?`<span class="tag" style="background:${c.bg};color:${c.fg}">${e.sub}</span>`:''}</div>
          <div class="exp-sub">${c.label} · ${e.date}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="exp-amt">${fmt(e.amt)}</div>
          <button class="del-btn" onclick="confirmDel(${e.id})"><i class="ti ti-trash"></i></button>
        </div>
      </div>`;
    }).join('');
  }).join('');
}
function setDF(f){dataFilter=f;selIds.clear();renderData();}
function togSel(id){if(selIds.has(id))selIds.delete(id);else selIds.add(id);updBulk();renderData();}
function clearSel(){selIds.clear();updBulk();renderData();}
function updBulk(){const n=selIds.size,b=document.getElementById('bulk-bar');if(n>0){b.classList.add('show');document.getElementById('bulk-lbl').textContent=n+' selected';}else b.classList.remove('show');}
function bulkDel(){
  if(!selIds.size)return;
  document.getElementById('conf-title').textContent='Delete '+selIds.size+' expense'+(selIds.size>1?'s':'')+'?';
  document.getElementById('conf-msg').textContent='This cannot be undone.';
  document.getElementById('conf-ok').onclick=()=>{expenses=expenses.filter(e=>!selIds.has(e.id));selIds.clear();ts();closeConf();renderData();updBadge();};
  document.getElementById('conf-modal').classList.add('open');
}
function updBadge(){const n=expenses.length;document.getElementById('data-badge').innerHTML=n?`<span class="badge">${n}</span>`:'';}
function exportCSV(){
  const rows=expenses.map(e=>`${e.date},"${e.desc}",${catById(e.cat).label},${e.sub||''},${e.amt.toFixed(2)}`);
  const csv=['Date,Description,Category,Sub-category,Amount',...rows].join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='expenses.csv';a.click();
}

document.getElementById('add-modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.getElementById('conf-modal').addEventListener('click',function(e){if(e.target===this)closeConf();});

expenses=tl();
if(!expenses.length){
  const p=(()=>{const d=new Date();d.setMonth(d.getMonth()-1);return d.toISOString().slice(0,7);})();
  const p2=(()=>{const d=new Date();d.setMonth(d.getMonth()-2);return d.toISOString().slice(0,7);})();
  expenses=[
    {id:1,amt:35.50,desc:'Uber to work',cat:'transport',sub:'Uber',date:tod()},
    {id:2,amt:62.00,desc:'Lunch with team',cat:'restaurant',sub:'Bar',date:tod()},
    {id:3,amt:1800.00,desc:'Monthly rent',cat:'home',sub:'Apartment Rent',date:tod()},
    {id:4,amt:189.90,desc:'Weekly groceries',cat:'market',sub:'Supermarket',date:new Date(Date.now()-86400000).toISOString().slice(0,10)},
    {id:5,amt:149.00,desc:'New shirt',cat:'shop',sub:'Clothing',date:new Date(Date.now()-2*86400000).toISOString().slice(0,10)},
    {id:6,amt:45.00,desc:'iFood dinner',cat:'restaurant',sub:'iFood',date:new Date(Date.now()-3*86400000).toISOString().slice(0,10)},
    {id:7,amt:120.00,desc:'Light bill',cat:'home',sub:'Light bill',date:new Date(Date.now()-4*86400000).toISOString().slice(0,10)},
    {id:8,amt:99.90,desc:'Internet plan',cat:'home',sub:'Internet bill',date:new Date(Date.now()-5*86400000).toISOString().slice(0,10)},
    {id:9,amt:29.90,desc:'Spotify',cat:'entertainment',sub:'Music',date:new Date(Date.now()-6*86400000).toISOString().slice(0,10)},
    {id:10,amt:210.00,desc:'Groceries',cat:'market',sub:'Supermarket',date:p+'-15'},
    {id:11,amt:95.00,desc:'Uber rides',cat:'transport',sub:'Uber',date:p+'-20'},
    {id:12,amt:1800.00,desc:'Rent',cat:'home',sub:'Apartment Rent',date:p+'-01'},
    {id:13,amt:130.00,desc:'Restaurants',cat:'restaurant',sub:'Bar',date:p+'-10'},
    {id:14,amt:55.00,desc:'Cinema',cat:'entertainment',sub:'Cinema',date:p2+'-12'},
    {id:15,amt:175.00,desc:'Market',cat:'market',sub:'Supermarket',date:p2+'-18'},
    {id:16,amt:1800.00,desc:'Rent',cat:'home',sub:'Apartment Rent',date:p2+'-01'},
  ];
  ts();
}
allMons().forEach(m=>cmpMonths.add(m));
renderHome();updBadge();
</script>
</body>
